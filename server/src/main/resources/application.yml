spring:
  application:
    name: fresh-delivery-server
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/yulin_fresh?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:yulin_fresh}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:10000}
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
    code2-session-url: ${WECHAT_MINIAPP_CODE2_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  pay:
    app-id: ${WECHAT_PAY_APP_ID:}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
    private-key: ${WECHAT_PAY_PRIVATE_KEY:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    platform-certificate-path: ${WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
    base-url: ${WECHAT_PAY_BASE_URL:https://api.mch.weixin.qq.com}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:}

auth:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    additional-username: ${ADMIN_ADDITIONAL_USERNAME:}
    additional-password: ${ADMIN_ADDITIONAL_PASSWORD:}
    session-ttl-ms: ${ADMIN_SESSION_TTL_MS:28800000}
    login-rate-limit:
      max-attempts: ${ADMIN_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-ms: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW_MS:900000}
  user:
    session-ttl-ms: ${AUTH_USER_SESSION_TTL_MS:2592000000}
  profile-storage-path: ${AUTH_PROFILE_STORAGE_PATH:data/user-profiles.json}

storefront:
  storage-path: ${STOREFRONT_STORAGE_PATH:data/storefront-state.json}
  seed-demo-data: ${STOREFRONT_SEED_DEMO_DATA:false}
  order-expiration-scan-ms: ${ORDER_EXPIRATION_SCAN_MS:60000}
  order-expiration-initial-delay-ms: ${ORDER_EXPIRATION_INITIAL_DELAY_MS:10000}

persistence:
  mode: ${PERSISTENCE_MODE:mysql}
  mysql:
    shadow-write-legacy-json: ${MYSQL_SHADOW_WRITE_LEGACY_JSON:true}

backup:
  directory: ${BACKUP_DIRECTORY:data/backups}
  data-directory: ${BACKUP_DATA_DIRECTORY:data}
  retention-count: ${BACKUP_RETENTION_COUNT:30}
  realtime-enabled: ${BACKUP_REALTIME_ENABLED:true}
  realtime-debounce-ms: ${BACKUP_REALTIME_DEBOUNCE_MS:1500}
  scheduled-interval-ms: ${BACKUP_SCHEDULED_INTERVAL_MS:300000}
  scheduled-initial-delay-ms: ${BACKUP_SCHEDULED_INITIAL_DELAY_MS:30000}

marketing:
  lottery:
    challenge-ttl-seconds: ${MARKETING_LOTTERY_CHALLENGE_TTL_SECONDS:600}
    consistency-scan-ms: ${MARKETING_LOTTERY_CONSISTENCY_SCAN_MS:300000}
    consistency-initial-delay-ms: ${MARKETING_LOTTERY_CONSISTENCY_INITIAL_DELAY_MS:30000}

delivery:
  enabled: ${DELIVERY_ENABLED:true}
  store:
    lat: ${DELIVERY_STORE_LAT:0}
    lng: ${DELIVERY_STORE_LNG:0}
  amap:
    web-key: ${AMAP_WEB_KEY:}
    js-key: ${AMAP_JS_KEY:}
    enabled: ${AMAP_ENABLED:false}
  push:
    provider: ${PUSH_PROVIDER:NOOP}
    jpush-app-key: ${JPUSH_APP_KEY:}
    jpush-master-secret: ${JPUSH_MASTER_SECRET:}
  privacy-number:
    provider: ${PRIVACY_NUMBER_PROVIDER:NOOP}
    aliyun-access-key-id: ${ALIYUN_AK_ID:}
    aliyun-access-key-secret: ${ALIYUN_AK_SECRET:}
    pool-key: ${ALIYUN_PNP_POOL_KEY:}
  dispatch:
    loop-enabled: ${DISPATCH_LOOP_ENABLED:true}
    loop-interval-ms: ${DISPATCH_LOOP_INTERVAL_MS:5000}
  tracking:
    cleanup-cron: ${TRACKING_CLEANUP_CRON:0 30 3 * * *}
    cleanup-zone: ${TRACKING_CLEANUP_ZONE:Asia/Shanghai}
  upload:
    delivery-path: ${DELIVERY_UPLOAD_PATH:data/uploads/delivery}
