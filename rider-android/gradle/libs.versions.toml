# ★ 版本目录 —— Wave 0 定稿,其他 Agent 只读。
# 版本均已在阿里云镜像上验证可解析(2026-08-11)。
# 与 docs/rider/06 §1 的差异:AGP 用 8.13.2(9.x 需 Gradle 9,本仓固定 Gradle 8.14.3)。

[versions]
kotlin = "2.3.21"
agp = "8.13.2"
ksp = "2.3.11"
# 06 §1 定为 2.59.2,但 Hilt 2.59+ 要求 AGP 9(AGP 9 又内置 Kotlin,骨架期不冒险),故降级
hilt = "2.58"
composeBom = "2026.06.01"
# core-ktx 1.19 / lifecycle 2.11 要求 compileSdk 37 + AGP 9.1,超出本工程锁定的 36,故降级
coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
room = "2.8.4"
work = "2.11.2"
datastore = "1.2.1"
retrofit = "3.0.0"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.11.0"
coil = "3.5.0"
camerax = "1.6.1"
# 高德:navi-3dmap 已内置 3dmap,二者不可同时依赖(重复类),3dmap 坐标仅作备查
amapNavi = "10.0.800_3dmap10.0.800"
amapLocation = "11.2.100"
amap3d = "10.0.600"
# 极光:阿里云镜像最高版本;jpush/jcore 配套关系待接入时用官方文档核对
jpush = "4.0.5"
jcore = "2.7.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# 高德:navi-3dmap 内置 3dmap,勿与 amap-map3d 同时引用
amap-navi3d = { group = "com.amap.api", name = "navi-3dmap", version.ref = "amapNavi" }
amap-location = { group = "com.amap.api", name = "location", version.ref = "amapLocation" }
amap-map3d = { group = "com.amap.api", name = "3dmap", version.ref = "amap3d" }

jpush = { group = "cn.jiguang.sdk", name = "jpush", version.ref = "jpush" }
jcore = { group = "cn.jiguang.sdk", name = "jcore", version.ref = "jcore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
